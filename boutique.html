<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boutique – Croquette &amp; Macadam</title>
  <meta name="description" content="La boutique solidaire de Croquette & Macadam : chaque achat finance les croquettes, le matériel et les soins vétérinaires.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#contenu">Aller au contenu</a>
  <header id="site-header"></header>

  <main id="contenu">
    <section class="page-hero">
      <div class="wrap">
        <p class="kicker">Boutique</p>
        <h1 data-c="shop.title"></h1>
        <p class="lead" data-c="shop.intro"></p>
        <div class="cta" id="shop-cta"></div>
      </div>
      <div data-wave></div>
    </section>

    <section class="section" style="padding-top:24px">
      <div class="wrap">
        <div id="shop-note"></div>
        <div class="cards" id="shop-root"></div>
        <!-- Pour intégrer directement une boutique Shopify (code "Buy Button" fourni par Shopify),
             colle son code HTML ici, dans cette zone : -->
        <div id="shop-embed"></div>
      </div>
    </section>
  </main>

  <div data-divider></div>
  <footer id="site-footer"></footer>
  <noscript><p style="padding:24px">Ce site nécessite JavaScript pour s'afficher.</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/content.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/boutique.js"></script>
</body>
</html>
